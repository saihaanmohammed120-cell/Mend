[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mend-backend"
version = "0.1.0"
description = "A bounded self-healing coding agent with verifiable execution receipts"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography==50.0.1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["mend*"]
