name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared framework dependencies
        run: python -m pip install '.[test]'
      - name: Compile modules
        run: python -m compileall -q mend scripts tests
      - name: Run local and installed-framework tests
        run: python -m unittest discover -s tests -v
      - name: Require genuine HTTP runtime verification
        run: python scripts/verify_http_runtime.py
      - name: Run labeled local repair rehearsal
        run: python scripts/local_rehearsal.py
  browser-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the locally verified TypeScript version
        run: npm install --global typescript@5.9.3
      - name: Compile and test the browser API bridge
        run: node --test web/mend-client.test.cjs
