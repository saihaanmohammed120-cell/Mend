name: mend
x-server: &server
  image: ${MEND_API_IMAGE:-mend-api:local}
  build:
    context: ..
    dockerfile: deploy/api.Dockerfile
  env_file:
    - ../.env
  environment:
    MEND_LOCAL_DATABASE: /var/lib/mend/tasks.sqlite3
    MEND_LOCAL_ARTIFACT_ROOT: /var/lib/mend/artifacts
  volumes:
    - mend-data:/var/lib/mend
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  init: true
services:
  api:
    <<: *server
    command: [uvicorn, mend.bootstrap:create_app_from_env, --factory, --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
  orchestrator:
    <<: *server
    profiles: [execution]
    command: [python, -m, mend.worker, --role, orchestrator]
  deadline:
    <<: *server
    profiles: [execution]
    command: [python, -m, mend.worker, --role, deadline]
volumes:
  mend-data:
