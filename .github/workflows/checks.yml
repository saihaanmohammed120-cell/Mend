name: Offline full-stack checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MEND_MODE: database_only
  MEND_LIVE_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  roadmap_tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
        working-directory: extensions/vscode-mend
      - name: Package the dependency-free receipt viewer
        run: npx --yes @vscode/vsce@4.0.0 package --no-dependencies --out mend-receipts.vsix --baseContentUrl https://github.com/saihaanmohammed120-cell/Mend/blob/main/extensions/vscode-mend
        working-directory: extensions/vscode-mend
      - uses: actions/upload-artifact@v4
        with:
          name: mend-receipts-vsix
          path: extensions/vscode-mend/mend-receipts.vsix
          if-no-files-found: error
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mend_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mend_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: mend_ci
      MEND_TEST_DATABASE_DSN: mend_ci
      MEND_TEST_DATABASE_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap only the disposable CI database and apply all migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/ci_supabase_prerequisites.sql
          for migration in migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -1 -f "$migration"; done
      - run: python scripts/verify_postgres_runtime.py --isolated
      - name: Team membership, receipt ownership and sharing through guarded SQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/team_receipt_ledger_fixture.sql
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Official library/python index; body digest verified on 22 October 2026.
      PYTHON_BASE_IMAGE: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash deploy/build_images.sh
      - name: Check isolated image imports without starting services or workloads
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python mend-api:local -c 'import os, mend.bootstrap; assert os.getuid() == 10001; print("API imports as non-root; no application factory called")'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python mend-runner:local -I -c 'import os, pathlib; assert os.getuid() == 10001; compile(pathlib.Path("/opt/mend/probe.py").read_text(), "probe.py", "exec"); print("Runner probe readable; workload not executed")'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python mend-spike:local -I -c 'import os, pathlib; assert os.getuid() == 10001; compile(pathlib.Path("/opt/mend/timing_probe.py").read_text(), "timing_probe.py", "exec"); print("Timing probe readable; workload not executed")'
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q mend scripts tests
      - run: python scripts/verify_http_runtime.py
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install './backend[test]'
        working-directory: .
      - name: Production frontend to real HTTP backend chain (fixture identity)
        run: MEND_TEST_PYTHON="$(command -v python)" node scripts/verify-backend-chain.mjs
